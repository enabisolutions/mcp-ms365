name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Regenerate the lockfile here because npm has an open bug
      # (npm/cli#4828) where platform-specific optional deps captured in
      # package-lock.json fail to install on a different OS than the one
      # that generated the lockfile. Our committed lockfile is generated
      # on macOS, so on Ubuntu CI the Linux build of rollup
      # (@rollup/rollup-linux-x64-gnu, an optional dep transitively
      # needed by vitest) is missing and the Build step crashes. Deleting
      # the lockfile and running `npm install` here re-resolves the
      # correct platform binaries. We lose byte-deterministic builds in
      # CI as a trade-off; if we ever need that back, generate the
      # lockfile inside a Linux container locally and commit it.
      - name: Install
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build Enabi client from endpoints.json
        run: npm run build:client

      - name: Capability audit (tools + scopes vs baseline)
        run: npm run audit:capabilities

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high

  # secret-scan is currently disabled. gitleaks-action@v2 switched to a
  # paid licensing model (requires GITLEAKS_LICENSE secret per
  # organisation). We have no real secrets committed — Azure app IDs are
  # public, employees' MSAL tokens live in their own keychains, not the
  # repo. To re-enable, either purchase a gitleaks license and add it as
  # a GitHub Actions secret, or replace this job with the open-source
  # gitleaks CLI invoked directly (see https://github.com/gitleaks/gitleaks
  # — the binary itself is still MIT-licensed; only the Action wrapper is
  # commercial).

